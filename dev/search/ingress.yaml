apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search
  namespace: yas-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: api.yas.local.com
    http:
      paths:
      - path: /search
        pathType: ImplementationSpecific
        backend:
          service:
            name: search
            port:
              number: 80
