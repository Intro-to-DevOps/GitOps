apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cart-retry
  namespace: yas-dev
spec:
  hosts:
  - cart
  http:
  - route:
    - destination:
        host: cart
        port:
          number: 80
    retries:
      attempts: 3
      perTryTimeout: 5s
      retryOn: "5xx,reset,connect-failure"
    timeout: 30s
---
