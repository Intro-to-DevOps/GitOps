apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: yas-dev
spec:
  action: DENY
  rules:
  - from:
    - source:
        notPrincipals: ["cluster.local/ns/yas-dev/sa/*"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-internal
  namespace: yas-dev
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
          - "cluster.local/ns/yas-dev/sa/cart"
          - "cluster.local/ns/yas-dev/sa/order"
          - "cluster.local/ns/yas-dev/sa/product"
          - "cluster.local/ns/yas-dev/sa/customer"
          - "cluster.local/ns/yas-dev/sa/inventory"
          - "cluster.local/ns/yas-dev/sa/tax"
          - "cluster.local/ns/yas-dev/sa/media"
          - "cluster.local/ns/yas-dev/sa/search"
          - "cluster.local/ns/yas-dev/sa/storefront-bff"
          - "cluster.local/ns/yas-dev/sa/backoffice-bff"
          - "cluster.local/ns/yas-dev/sa/rating"
          - "cluster.local/ns/yas-dev/sa/promotion"
          - "cluster.local/ns/yas-dev/sa/payment"
          - "cluster.local/ns/yas-dev/sa/payment-paypal"
          - "cluster.local/ns/yas-dev/sa/recommendation"
          - "cluster.local/ns/yas-dev/sa/webhook"
