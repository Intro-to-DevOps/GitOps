              value: "[{ url: 'http://api.yas.local.com/product/v3/api-docs', name: 'Product' },{ url: 'http://api.yas.local.com/media/v3/api-docs', name: 'Media' },{ url: 'http://api.yas.local.com/customer/v3/api-docs', name: 'Customer' },{ url: 'http://api.yas.local.com/cart/v3/api-docs', name: 'Cart'},{ url: 'http://api.yas.local.com/rating/v3/api-docs', name: 'Rating' }, { url: 'http://api.yas.local.com/order/v3/api-docs', name: 'Order'},{ url: 'http://api.yas.local.com/payment/v3/api-docs', name: 'Payment'},{ url: 'http://api.yas.local.com/payment-paypal/v3/api-docs', name: 'Payment-paypal'},{ url: 'http://api.yas.local.com/location/v3/api-docs', name: 'Location'}, { url: 'http://api.yas.local.com/inventory/v3/api-docs', name: 'Inventory'},{ url: 'http://api.yas.local.com/tax/v3/api-docs', name: 'Tax' },{ url: 'http://api.yas.local.com/promotion/v3/api-docs', name: 'Promotion'},{ url: 'http://api.yas.local.com/search/v3/api-docs', name: 'Search'}, { url: 'http://api.yas.local.com/webhook/v3/api-docs', name: 'Webhook'}]"
            - name: OAUTH_CLIENT_ID
              value: "swagger-ui"
            - name: OAUTH_USE_PKCE
              value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: yas-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
