#Configmap of gateway routes config for bff microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: yas-gateway-routes-config-configmap
  annotations:
    reloader.stakater.com/match: "true"
data:
  gateway-routes-config.yaml: |
    spring:
      cloud:
        gateway:
          routes:
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: product_api
            predicates:
            - Path=/api/product/**
            uri: http://product
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: location_api
            predicates:
            - Path=/api/location/**
            uri: http://location
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: inventory_api
            predicates:
            - Path=/api/inventory/**
            uri: http://inventory
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: cart_api
            predicates:
            - Path=/api/cart/**
            uri: http://cart
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: customer_api
            predicates:
            - Path=/api/customer/**
            uri: http://customer
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: media_api
            predicates:
            - Path=/api/media/**
            uri: http://media
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: rating_api
            predicates:
            - Path=/api/rating/**
            uri: http://rating
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: tax_api
            predicates:
            - Path=/api/tax/**
            uri: http://tax
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: promotion_api
            predicates:
            - Path=/api/promotion/**
            uri: http://protion
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: search_api
            predicates:
            - Path=/api/search/**
            uri: http://search
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: order_api
            predicates:
            - Path=/api/order/**
            uri: http://order
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: recommendation_api
            predicates:
            - Path=/api/recommendation/**
            uri: http://recommendation
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: webhook_api
            predicates:
            - Path=/api/webhook/**
            uri: http://webhook
          - filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
            - TokenRelay=
            id: sampledata_api
            predicates:
            - Path=/api/sampledata/**
            uri: http://sampledata
          - id: ui
            predicates:
            - Path=/**
            uri: ${UI_HOST}
