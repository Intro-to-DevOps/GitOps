apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-storefront-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nashtech-garage.github.io/yas/
    chart: storefront-ui
    targetRevision: 0.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: yas-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true